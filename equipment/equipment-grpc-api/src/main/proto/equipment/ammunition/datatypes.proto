syntax = "proto3";

package ru.otus.courses.java.advanced.shooter.server.equipment.protobuf.ammunition;

option java_multiple_files = true;

import "equipment/gun/datatypes.proto";
import "equipment/ammunition/imported_datatypes.proto";
import "common/common.proto";

message AmmunitionInfo {
  int32 id = 1;
  bool enabled = 2;
  string name = 3;
  int32 speed = 4;
  int32 damage_mean_value = 5;
  int32 damage_variance = 6;
  repeated gun.GunReducedInfo compatible_guns = 7;
  int64 created_timestamp = 8;
  int64 updated_timestamp = 9;
}

message AmmunitionInfoListPage {
  repeated AmmunitionInfo data = 1;
  ru.otus.courses.java.advanced.shooter.server.common.protobuf.PaginationInfo pagination_info = 2;
}

message CreateAmmunitionRequest {
  AmmunitionWritableData data = 1;
}

message UpdateAmmunitionRequest {
  int32 ammunition_id = 1;
  AmmunitionWritableData data = 2;
}

message AmmunitionWritableData {
  bool enabled = 1;
  string name = 2;
  int32 speed = 3;
  int32 damage_mean_value = 4;
  int32 damage_variance = 5;
  repeated int32 compatible_gun_ids = 6;
}

message GetAmmunitionRequest {
  int32 ammunition_id = 1;
}

message GetEnabledAmmunitionRequest {
  int32 ammunition_id = 1;
}

message GetAmmunitionListRequest {
  optional common.protobuf.PaginationRequest pagination_request = 1;
  optional AmmunitionFilter filter = 2;
  optional common.protobuf.RelatedEntitiesInclusionMode compatible_guns_inclusion_mode = 3;
}

message AmmunitionFilter {
  optional bool enabled = 1;
  optional string name = 2;
  repeated int32 compatible_gun_ids = 3;
  optional bool only_enabled_compatible_guns = 4;
  repeated int32 ammunition_ids = 5;
  optional int64 updated_after = 6;
}
