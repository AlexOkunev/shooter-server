syntax = "proto3";

package ru.otus.courses.java.advanced.shooter.server.equipment.protobuf.gun;

option java_multiple_files = true;

import "equipment/ammunition/imported_datatypes.proto";
import "equipment/attachment/imported_datatypes.proto";
import "common/common.proto";

enum GunType {
  PISTOL = 0;
  SUBMACHINE_GUN = 1;
  ASSAULT_RIFLE = 2;
  SCATTERSHOT = 3;
  MACHINE_GUN = 4;
  PRECISION_RIFLE = 5;
}

message GunInfo {
  int32 id = 1;
  bool enabled = 2;
  string name = 3;
  int32 weight_grams = 4;
  int32 rate_of_fire_per_minute = 5;
  GunType type = 6;
  repeated ammunition.AmmunitionReducedInfo compatible_ammunition_infos = 7;
  repeated attachment.AttachmentReducedInfo compatible_attachments = 8;
  int64 created_timestamp = 9;
  int64 updated_timestamp = 10;
}

message GunReducedInfo {
  int32 id = 1;
  bool enabled = 2;
  string name = 3;
  int32 weight_grams = 4;
  int32 rate_of_fire_per_minute = 5;
  GunType type = 6;
}

message GunInfoListPage {
  repeated GunInfo data = 1;
  ru.otus.courses.java.advanced.shooter.server.common.protobuf.PaginationInfo pagination_info = 2;
}

message GunWritableData {
  bool enabled = 1;
  string name = 2;
  GunType type = 3;
  int32 weight_grams = 4;
  int32 rate_of_fire_per_minute = 5;
  repeated int32 compatible_ammunition_ids = 6;
  repeated int32 compatible_attachment_ids = 7;
}

message CreateGunRequest {
  GunWritableData data = 1;
}

message UpdateGunRequest {
  int32 gun_id = 1;
  GunWritableData data = 2;
}

message GetGunRequest {
  int32 gun_id = 1;
}

message GetEnabledGunRequest {
  int32 gun_id = 1;
}

message GetGunsRequest {
  optional common.protobuf.PaginationRequest pagination_request = 1;
  optional GunsFilter filter = 2;
  optional common.protobuf.RelatedEntitiesInclusionMode related_entities_inclusion_mode = 3;
}

message GunsFilter {
  optional bool enabled = 1;
  optional string name = 2;
  optional GunType type = 3;
  repeated int32 gun_ids = 4;
  optional int64 updated_after = 5;
}
