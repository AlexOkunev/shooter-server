syntax = "proto3";

package ru.otus.courses.java.advanced.shooter.server.equipment.protobuf.currency;

option java_multiple_files = true;

import "equipment/currency/datatypes.proto";

service CurrencyServiceAPI {
  rpc GetCurrency(GetCurrencyRequest) returns (CurrencyInfo);
  rpc GetEnabledCurrency(GetEnabledCurrencyRequest) returns (CurrencyInfo);
  rpc GetCurrencies(GetCurrenciesRequest) returns (CurrencyInfoListPage);
  rpc CreateCurrency(CreateCurrencyRequest) returns (CurrencyInfo);
  rpc UpdateCurrency(UpdateCurrencyRequest) returns (CurrencyInfo);
}