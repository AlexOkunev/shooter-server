syntax = "proto3";

package ru.otus.courses.java.advanced.shooter.server.equipment.protobuf.gun;

option java_multiple_files = true;

import "gun/datatypes.proto";

service GunServiceAPI {
  rpc GetGun(GetGunRequest) returns (GunInfo);
  rpc GetEnabledGun(GetEnabledGunRequest) returns (GunInfo);
  rpc GetGuns(GetGunsRequest) returns (GunInfoListPage);
  rpc CreateGun(CreateGunRequest) returns (GunInfo);
  rpc UpdateGun(UpdateGunRequest) returns (GunInfo);
}