syntax = "proto3";

package ru.otus.courses.java.advanced.shooter.server.market.protobuf.money.bundle;

option java_multiple_files = true;

import "common/common.proto";

message MoneyBundleInfo {
  int32 id = 1;
  int32 currency_id = 2;
  int32 currency_amount = 3;
  int32 rubles_price = 4;
  bool enabled = 5;
  int64 created_timestamp = 6;
  int64 updated_timestamp = 7;
  int32 version = 8;
}

message MoneyBundleInfoListPage {
  repeated MoneyBundleInfo data = 1;
  common.protobuf.PaginationInfo pagination_info = 2;
}

message GetMoneyBundleRequest {
  int32 id = 1;
}

message GetMoneyBundlesRequest {
  optional common.protobuf.PaginationRequest pagination_request = 1;
  optional Filter filter = 2;

  message Filter {
    optional bool enabled = 1;
    optional bool currency_enabled = 2;
    optional bool currency_can_be_bought = 3;
    repeated int32 currency_ids = 4;
  }
}

message CreateMoneyBundleRequest {
  MoneyBundleWritableData data = 1;
}

message UpdateMoneyBundleRequest {
  int32 id = 1;
  MoneyBundleWritableData data = 2;
  int32 version = 3;
}

message MoneyBundleWritableData {
  int32 currency_id = 1;
  int32 currency_amount = 2;
  int32 rubles_price = 3;
  bool enabled = 4;
}