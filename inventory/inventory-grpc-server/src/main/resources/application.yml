spring:
  application:
    name: inventory-grpc-server

  datasource:
    url: jdbc:postgresql://localhost:5435/inventory_db
    username: inventory_db_user
    password: inventory_db_user_password

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true
          fetch_size: 400
        generate_statistics: true
        format_sql: true
        default_schema: public

  flyway:
    schemas: public
    url: jdbc:postgresql://localhost:5435/inventory_db
    user: inventory_db_user
    password: inventory_db_user_password

grpc:
  port: 6568
  shutdownGrace: 30
  enable-reflection: true

# TODO SET NORMAL
reference-data-caching:
  data-page-size: 10
  refresh-rate-seconds: 200000
  scheduled-refresh-cache-enabled: true