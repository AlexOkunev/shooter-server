syntax = "proto3";

package ru.otus.courses.java.advanced.shooter.server.common.protobuf;

option java_multiple_files = true;

message PaginationRequest {
  int32 count = 1;
  int32 page = 2;
}

message PaginationInfo {
  int64 totalCount = 1;
  int32 totalPages = 2;
  int32 currentPageNumber = 3;
}

enum RelatedEntitiesInclusionMode {
  DONT_INCLUDE = 0;
  INCLUDE_ONLY_ENABLED = 1;
  INCLUDE_ALL = 2;
}
