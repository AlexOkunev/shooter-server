syntax = "proto3";

package ru.otus.courses.java.advanced.shooter.server.players.protobuf.common;

message Error {
  string message = 1;
  ErrorType error_type = 2;

  enum ErrorType{
    VALIDATION = 0;
    INTERNAL_SERVER_ERROR = 1;
    DATA_NOT_FOUND = 2;
  }
}

message PaginationRequest {
  int32 count = 1;
  int32 page = 2;
}
