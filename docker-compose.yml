version: '3.7'

services:
  players-keycloak-postgres:
    image: postgres:16.2
    volumes:
      - players-keycloak-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/custom-config.conf:/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: players_keycloak_db
      POSTGRES_USER: players_keycloak_db_user
      POSTGRES_PASSWORD: players_keycloak_db_user_password
      POSTGRES_PORT: 5432
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      - shooter-network

  players-postgres:
    image: postgres:16.2
    volumes:
      - players-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/custom-config.conf:/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: players_db
      POSTGRES_USER: players_db_user
      POSTGRES_PASSWORD: players_db_user_password
      POSTGRES_PORT: 5432
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5433:5432"
    networks:
      - shooter-network

  equipment-postgres:
    image: postgres:16.2
    volumes:
      - equipment-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/custom-config.conf:/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: equipment_db
      POSTGRES_USER: equipment_db_user
      POSTGRES_PASSWORD: equipment_db_user_password
      POSTGRES_PORT: 5432
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5434:5432"
    networks:
      - shooter-network

  inventory-postgres:
    image: postgres:16.2
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/custom-config.conf:/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_db_user
      POSTGRES_PASSWORD: inventory_db_user_password
      POSTGRES_PORT: 5432
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5435:5432"
    networks:
      - shooter-network

  market-postgres:
    image: postgres:16.2
    volumes:
      - market-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/custom-config.conf:/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: market_db
      POSTGRES_USER: market_db_user
      POSTGRES_PASSWORD: market_db_user_password
      POSTGRES_PORT: 5432
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5436:5432"
    networks:
      - shooter-network

  payment-stub-postgres:
    image: postgres:16.2
    volumes:
      - payment-stub-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/custom-config.conf:/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_DB: payment_stub_db
      POSTGRES_USER: payment_stub_db_user
      POSTGRES_PASSWORD: payment_stub_db_user_password
      POSTGRES_PORT: 5432
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5437:5432"
    networks:
      - shooter-network

  players-keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: [ "start-dev", "--http-port=7777" ]
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HTTPS_REQUIRED: "none"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://players-keycloak-postgres/players_keycloak_db
      KC_DB_USERNAME: players_keycloak_db_user
      KC_DB_PASSWORD: players_keycloak_db_user_password
    ports:
      - "7777:7777"
    restart: always
    depends_on:
      - players-keycloak-postgres
    networks:
      - shooter-network

  kafka1:
    image: confluentinc/cp-kafka:8.1.0
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9091:9091"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:19091,PLAINTEXT_EXTERNAL://:9091,CONTROLLER://:29091"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:19091,PLAINTEXT_EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9091"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29091,2@kafka2:29092,3@kafka3:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
    volumes:
      - kafka1-data:/var/lib/kafka/data
    networks:
      - shooter-network

  kafka2:
    image: confluentinc/cp-kafka:8.1.0
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_EXTERNAL://:9092,CONTROLLER://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:19092,PLAINTEXT_EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29091,2@kafka2:29092,3@kafka3:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
    volumes:
      - kafka2-data:/var/lib/kafka/data
    networks:
      - shooter-network

  kafka3:
    image: confluentinc/cp-kafka:8.1.0
    container_name: kafka3
    hostname: kafka3
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:19093,PLAINTEXT_EXTERNAL://:9093,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka3:19093,PLAINTEXT_EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29091,2@kafka2:29092,3@kafka3:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
    volumes:
      - kafka3-data:/var/lib/kafka/data
    networks:
      - shooter-network

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.0
    hostname: schema-registry
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka1:19091,kafka2:19092,kafka3:19093"
      SCHEMA_REGISTRY_DEBUG: 'true'
    networks:
      - shooter-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - schema-registry
      - kafka-connect
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka1:19091,kafka2:19092,kafka3:19093
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: local
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    networks:
      - shooter-network

  kafka-connect:
    image: confluentinc/cp-kafka-connect:8.1.0
    container_name: kafka-connect
    hostname: kafka-connect
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - schema-registry
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka1:19091,kafka2:19092,kafka3:19093"
      CONNECT_REST_PORT: "8083"
      CONNECT_GROUP_ID: "local-connect"
      CONNECT_CONFIG_STORAGE_TOPIC: "local-connect-config"
      CONNECT_OFFSET_STORAGE_TOPIC: "local-connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "local-connect-status"
      CONNECT_KEY_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONNECT_VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_LOG4J_ROOT_LOGLEVEL: "INFO"
      CONNECT_PLUGIN_PATH: /usr/share/java/,/etc/kafka-connect/jars
    volumes:
      - ./infra/kafka-connect/jars:/etc/kafka-connect/jars
    networks:
      - shooter-network

volumes:
  players-keycloak-postgres-data:
    driver: local
  players-postgres-data:
    driver: local
  equipment-postgres-data:
    driver: local
  inventory-postgres-data:
    driver: local
  market-postgres-data:
    driver: local
  payment-stub-postgres-data:
    driver: local
  kafka1-data:
    driver: local
  kafka2-data:
    driver: local
  kafka3-data:
    driver: local

networks:
  shooter-network:
    driver: bridge