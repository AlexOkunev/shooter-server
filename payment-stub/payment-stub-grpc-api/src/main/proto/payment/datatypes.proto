syntax = "proto3";

package ru.otus.courses.java.advanced.shooter.server.payment.protobuf;

option java_multiple_files = true;

message CreatePaymentRequest {
  string player_uuid = 1;
  string player_email = 2;
  string trade_uuid = 3;
  int32 rubles_amount = 4;
}

message CreatePaymentResponse {
  string payment_session = 1;
  string public_token = 2;
  string payment_uuid = 3;
  int64 created_timestamp = 4;
}