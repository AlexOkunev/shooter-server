appName: shooter-server-players-grpc

replicas: 1
terminationGracePeriodSeconds: 30

image:
  repository: otus-java-advanced/shooter-server-players-grpc-server
  tag: "1.0"
  pullPolicy: IfNotPresent

grpc:
  port: 6565
  shutdownGrace: 20
  enableReflection: true

db:
  name: players_db
  serviceName: players-db-service
  secretName: players-db-secret
  port: 5433
  schema: public
  jpa:
    jdbcBatchSize: 100
    jdbcFetchSize: 400

resources:
  requests:
    cpu: "1"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "2Gi"