appName: shooter-server-api-gateway-admin

replicas: 1
terminationGracePeriodSeconds: 30

image:
  repository: otus-java-advanced/shooter-server-api-gateway-admin
  tag: "1.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

actuator:
  port: 9090

keycloak:
  host: host.docker.internal
  port: 7778
  realm: shooter-admin

scheduling:
  poolSize: 5

caches:
  enabled: true
  currency:
    pageSize: 100
    refreshByScheduleEnabled: true
    refreshIntervalMs: 30000
  gun:
    pageSize: 100
    refreshByScheduleEnabled: true
    refreshIntervalMs: 30000
  grenade:
    pageSize: 100
    refreshByScheduleEnabled: true
    refreshIntervalMs: 30000
  ammunition:
    pageSize: 100
    refreshByScheduleEnabled: true
    refreshIntervalMs: 30000
  attachment:
    pageSize: 100
    refreshByScheduleEnabled: true
    refreshIntervalMs: 30000

grpcServices:
  player:
    host: shooter-server-players-grpc-cluster-ip-service
    port: 6565
    deadlineMs: 10000
    retry:
      enabled: true
      maxAttempts: 5
      initialBackoff: 0.2s
      maxBackoff: 2s
      backoffMultiplier: 1.7
      throttling:
        enabled: true
        maxTokens: 30
        tokenRatio: 0.2

  equipment:
    host: shooter-server-equipment-grpc-cluster-ip-service
    port: 6565
    deadlineMs: 10000
    retry:
      enabled: true
      maxAttempts: 5
      initialBackoff: 0.2s
      maxBackoff: 2s
      backoffMultiplier: 1.7
      throttling:
        enabled: true
        maxTokens: 30
        tokenRatio: 0.2

  market:
    host: shooter-server-market-grpc-cluster-ip-service
    port: 6565
    deadlineMs: 10000
    retry:
      enabled: true
      maxAttempts: 5
      initialBackoff: 0.2s
      maxBackoff: 2s
      backoffMultiplier: 1.7
      throttling:
        enabled: true
        maxTokens: 30
        tokenRatio: 0.2

  inventory:
    host: shooter-server-inventory-grpc-cluster-ip-service
    port: 6565
    deadlineMs: 10000
    retry:
      enabled: true
      maxAttempts: 5
      initialBackoff: 0.2s
      maxBackoff: 2s
      backoffMultiplier: 1.7
      throttling:
        enabled: true
        maxTokens: 30
        tokenRatio: 0.2

resilience4j:
  grpcRps:
    limitForPeriod: 1000
    limitRefreshPeriod: 1s
    timeoutDuration: 0s
  grpcRpm:
    limitForPeriod: 60000
    limitRefreshPeriod: 1m
    timeoutDuration: 0s

grpcPools:
  equipment:
    maxThreads: 20
    maxQueuedTasks: 1000
    threadNamePrefix: grpc-equipment
  inventory:
    maxThreads: 20
    maxQueuedTasks: 1000
    threadNamePrefix: grpc-inventory
  market:
    maxThreads: 20
    maxQueuedTasks: 1000
    threadNamePrefix: grpc-market
  player:
    maxThreads: 20
    maxQueuedTasks: 1000
    threadNamePrefix: grpc-player

resources:
  requests:
    cpu: "1"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "2Gi"