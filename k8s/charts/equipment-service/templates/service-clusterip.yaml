apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.appName }}-cluster-ip-service"
  labels:
    app.kubernetes.io/name: {{ .Values.appName }}
    metrics: "enabled"
spec:
  selector:
    app: {{ .Values.appName }}
  ports:
    - name: grpc
      port: {{ .Values.grpc.port }}
      targetPort: grpc
    - name: http-metrics
      port: {{ .Values.actuator.port }}
      targetPort: actuator
  type: ClusterIP
