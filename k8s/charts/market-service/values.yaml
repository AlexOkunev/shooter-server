appName: shooter-server-market-grpc

replicas: 1
terminationGracePeriodSeconds: 30

image:
  repository: otus-java-advanced/shooter-server-market-grpc-server
  tag: "1.0"
  pullPolicy: IfNotPresent

grpc:
  port: 6565
  shutdownGrace: 20
  enableReflection: true

db:
  name: market_db
  serviceName: market-db-service
  secretName: market-db-secret
  port: 5436
  schema: public
  jpa:
    jdbcBatchSize: 100
    jdbcFetchSize: 400

kafka:
  node1:
    serviceName: kafka-node-1
    port: 9091
  node2:
    serviceName: kafka-node-2
    port: 9092
  node3:
    serviceName: kafka-node-3
    port: 9093
  schemaRegistry:
    serviceName: kafka-schema-registry-service
    port: 8081
  consumer:
    enableAutoCommit: false
    autoOffsetReset: earliest
    properties:
      maxPollRecords: 200
      fetchMaxWaitMs: 500
      fetchMinBytes: 1
      maxPollIntervalMs: 300000
      sessionTimeoutMs: 15000
      heartbeatIntervalMs: 5000
  listener:
    ackMode: record

equipmentKafka:
  topics: "db.equipment.public.ammunition,db.equipment.public.attachment,db.equipment.public.grenade,db.equipment.public.gun"
  groupId: "market-equipment-consumer-test-2"

currencyKafka:
  topic: "db.equipment.public.currency"
  groupId: "market-equipment-currency-consumer-test-2"

playersKafka:
  topic: "db.public.player"
  groupId: "market-player-message-consumer-test-6"

paymentKafka:
  topic: "db.payment.public.payment_processed_message_outbox_v2"
  groupId: market-payment-processed-message-consumer-test-6

inventoryProductTradeIssuancePerformedKafka:
  topic: "db.inventory.public.product_trade_issuance_performed_message_outbox"
  groupId: "inventory-product-trade-issuance-performed-message-consumer-test-1"

referenceDataCaching:
  dataPageSize: 100
  refreshRateSeconds: 600
  scheduledRefreshCacheEnabled: true

stuckMoneyBundleTradeProcessing:
  enabled: true
  period: 10s
  paymentCreationWaitProcessing:
    enabled: true
    maxStuckPeriod: 30s
  paymentPendingProcessing:
    enabled: true
    maxStuckPeriod: 30m

#TODO!!! use k8s
paymentStubGrpc:
  host: shooter-server-payment-stub-grpc-cluster-ip-service
  port: 6565
  deadlineMs: 20000

resources:
  requests:
    cpu: "1"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "2Gi"