apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: all-services-service-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      metrics: "enabled"
  endpoints:
    - port: http-metrics
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s