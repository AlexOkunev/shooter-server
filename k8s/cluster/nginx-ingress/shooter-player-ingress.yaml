apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shooter-player-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: player.shooter.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shooter-server-api-gateway-player-cluster-ip-service
                port:
                  number: 8080